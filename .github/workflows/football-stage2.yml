name: Football Stage 2 research model audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-capture-and-grading
  cancel-in-progress: false
jobs:
  football-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh and read-back Stage 1 evidence
        id: stage1
        continue-on-error: true
        run: >-
          python -u scripts/run_football_stage1.py
          --database "${{ runner.temp }}/football-stage2/evidence.sqlite3"
          --output-dir "${{ runner.temp }}/football-stage2/stage1"
      - name: Audit and gate four exact football model scopes
        run: >-
          python -u scripts/run_football_stage2.py
          --database "${{ runner.temp }}/football-stage2/evidence.sqlite3"
          --stage1-audit "${{ runner.temp }}/football-stage2/stage1/football-stage1-cycle-audit.json"
          --output-dir "${{ runner.temp }}/football-stage2/artifacts"
      - name: Retain sanitized Stage 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-stage2-research-audit
          path: ${{ runner.temp }}/football-stage2/artifacts/*.json
          if-no-files-found: warn
