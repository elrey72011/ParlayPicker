name: NBA news capture (research)
# News-edge step 3 (owner 2026-11-09): through the evening slate, read each official NBA injury
# report as it is published and, for games with material news, capture prices (US books,
# Pinnacle, Novig where switched on; spreads and totals) at once and 10 minutes later.
# Off unless the PARLAYPICKER_NEWS_CAPTURE repository variable names NBA. 4 Odds API credits
# per request, from its own allowance (100/day, 2,500 per 31 days). No stake or wager authority.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep watching (max 340)"
        required: false
        default: "340"
  schedule:
    - cron: '47 21 * * *'     # 4:47 PM EST / 5:47 PM EDT, through the evening slate
    - cron: '47 22 * * *'     # backup start: GitHub often skips or delays scheduled runs (2026-11-09)
permissions:
  contents: read
concurrency:
  group: nba-news-capture
  cancel-in-progress: false
jobs:
  news-capture:
    if: vars.PARLAYPICKER_NEWS_CAPTURE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PARLAYPICKER_NEWS_CAPTURE: ${{ vars.PARLAYPICKER_NEWS_CAPTURE }}
      PARLAYPICKER_NOVIG_SPORTS: ${{ vars.PARLAYPICKER_NOVIG_SPORTS }}
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        # Read-only: the restore (about 100,000 objects) otherwise downloads the whole store
        # each night and eats into the slate (audit 2026-11-09).
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Watch injury reports and capture prices after news
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
          PARLAYPICKER_DRIVE_CACHE_DIR: ${{ runner.temp }}/drive-cache
        run: python -u scripts/news_capture_loop.py --minutes "$MINUTES" --interval 5
