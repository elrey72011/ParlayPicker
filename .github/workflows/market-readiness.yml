name: Market readiness (read-only)
# Roadmap C0: restore the Drive evidence into an empty runner directory and report
# all 12 sport x market families with their next blocker. Read-only: the Drive client
# refuses every upload (scripts/market_readiness_report.py). No Odds API or CFBD calls.
# --publish (owner 2026-11-10) uploads the finished report as one object under its own
# prefix, outside the evidence, so the app can show it.
# The canonical store is ~80k small Drive objects; a checksum-verified object cache is
# kept between runs (actions/cache), so only the first run downloads everything.
on:
  # Daily read-only report for the app's Qualification progress panel (roadmap C3).
  schedule:
    - cron: '17 11 * * *'
    - cron: '47 13 * * *'      # backup start: GitHub often skips scheduled runs (2026-11-06)
  workflow_dispatch:
    inputs:
      with_sources:
        description: "Also restore each sport's research store (descriptive counts; much slower)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: market-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      # Settlement settings, so the report shows each market's real stage (D17).
      PARLAYPICKER_NHL_SETTLEMENT: ${{ vars.PARLAYPICKER_NHL_SETTLEMENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-readiness-${{ github.run_id }}
          restore-keys: |
            drive-cache-
            market-readiness-drive-cache-
      - name: Restore read-only and report readiness
        run: >-
          python -u scripts/market_readiness_report.py
          --directory "${{ runner.temp }}/readiness-evidence"
          --output "${{ runner.temp }}/readiness/market-readiness.json"
          --cache-dir "${{ runner.temp }}/drive-cache"
          --publish
          ${{ inputs.with_sources && '--with-sources' || '' }}
      - name: Save the verified Drive object cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-readiness-${{ github.run_id }}
      - name: Keep the readiness report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: market-readiness
          path: ${{ runner.temp }}/readiness/
          if-no-files-found: warn
