name: Decision capture (C6, qualified markets only)
# Roadmap C6 step 1: the market gate needs a quote at most 30 minutes old, so through each
# slate this records fresh quotes and bound predictions every 15 minutes for the markets
# named in the PARLAYPICKER_DECISION_MARKETS repository variable (for example NCAAB:SPREAD),
# and only while each is qualified. Off when the variable is empty. 1 Odds API credit per
# request, from its own allowance (60/day, 1,500 per 31 days). No stake or wager authority.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep capturing (max 340)"
        required: false
        default: "340"
  schedule:
    - cron: '7 22 * * *'      # 5:07 PM EST / 6:07 PM EDT, through the evening slate
    - cron: '7 16 * * 0,6'    # weekends 11:07 AM EST, early games
permissions:
  contents: read
concurrency:
  group: decision-capture
  cancel-in-progress: false
jobs:
  decision-capture:
    if: vars.PARLAYPICKER_DECISION_MARKETS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PARLAYPICKER_DECISION_MARKETS: ${{ vars.PARLAYPICKER_DECISION_MARKETS }}
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture decision quotes and predictions through the slate
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
        run: python -u scripts/decision_capture_loop.py --minutes "$MINUTES" --interval 15
