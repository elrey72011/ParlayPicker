name: Football Stage 1 data foundation
on:
  workflow_dispatch:
    inputs:
      stage2_audit:
        description: 'Also run the gated Stage 2 football research audit'
        type: boolean
        required: false
        default: false
  # Schedule paused (owner decision 2026-11-09): every run failed on NCAAF games with revised
  # kickoffs (NCAAF runtime code needs owner approval to change), neither football screen found
  # an edge, and outside research-loop hours it spent about 4 Odds API credits an hour. Manual
  # runs still work; restore the cron when football work resumes.
permissions:
  contents: read
  actions: read
jobs:
  loop-check:
    # Outside the concurrency group: a scheduled run that would queue behind a research loop
    # and cancel it (GitHub keeps one pending run per group) does nothing instead (audit 2026-11-09).
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active: ${{ steps.loop.outputs.active }}
    steps:
      - uses: actions/checkout@v5
      - id: loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research_loop_active.py
  football-stage1:
    if: (github.event_name == 'workflow_dispatch' || vars.RESEARCH_SCHEDULER_ENABLED == 'true') && needs.loop-check.outputs.active != 'true'
    needs: loop-check
    runs-on: ubuntu-latest
    concurrency:
      group: research-capture-and-grading
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-football-stage1-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Restore, capture, settle and verify Stage 1 evidence
        env:
          PARLAYPICKER_DRIVE_CACHE_DIR: ${{ runner.temp }}/drive-cache
        continue-on-error: ${{ inputs.stage2_audit == true }}
        run: >-
          python -u scripts/run_football_stage1.py
          --database "${{ runner.temp }}/football-stage1/evidence.sqlite3"
          --output-dir "${{ runner.temp }}/football-stage1/artifacts"
      - name: Save the verified Drive object cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-football-stage1-${{ github.run_id }}
      - name: Retain sanitized Stage 1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-stage1-cycle-audit
          path: ${{ runner.temp }}/football-stage1/artifacts/*.json
          if-no-files-found: warn
      - name: Audit Stage 2 exact-scope football research models
        if: ${{ inputs.stage2_audit == true }}
        run: >-
          python -u scripts/run_football_stage2.py
          --database "${{ runner.temp }}/football-stage1/evidence.sqlite3"
          --stage1-audit "${{ runner.temp }}/football-stage1/artifacts/football-stage1-cycle-audit.json"
          --output-dir "${{ runner.temp }}/football-stage1/stage2-artifacts"
      - name: Retain sanitized Stage 2 diagnostics
        if: ${{ always() && inputs.stage2_audit == true }}
        uses: actions/upload-artifact@v4
        with:
          name: football-stage2-research-audit
          path: ${{ runner.temp }}/football-stage1/stage2-artifacts/*.json
          if-no-files-found: warn
