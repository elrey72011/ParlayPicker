name: Qualification operations offline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qualification-operations-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The suite runs tests/qualification_ops against a pinned application commit (below), so on a
  # pull request only changes to the suite or this workflow can change its result. Other pull
  # requests skip the three partitions; the combined check still reports (owner 2026-11-08: about
  # 25 minutes per pull request). Pushes to main always run the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
      - name: Does this change touch the offline suite?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE...$HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^(tests/qualification_ops/|\.github/workflows/qualification-operations\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  offline-operations:
    name: ${{ matrix.check_name }}
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            partition: all
            timeout_minutes: 50
            check_name: offline-operations (ubuntu-latest)
            artifact_name: qualification-operations-ubuntu-latest
          - os: windows-latest
            partition: standard
            timeout_minutes: 50
            check_name: offline-operations (windows-latest standard)
            artifact_name: qualification-operations-windows-standard
          - os: windows-latest
            partition: full-corpus
            timeout_minutes: 90
            check_name: offline-operations (windows-latest full-corpus)
            artifact_name: qualification-operations-windows-full-corpus
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: tooling
      - name: Check out immutable application dependency
        uses: actions/checkout@v5
        with:
          ref: 7c4fe71c7b9bd1a7ae73f8ba04b5e9a79d720eea
          path: application
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/tests/qualification_ops/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tooling/tests/qualification_ops/requirements.txt
      - name: Execute offline lifecycle and recovery regressions
        env:
          PARLAYPICKER_QUALIFICATION_APPLICATION_CHECKOUT: ${{ github.workspace }}/application
        run: python -B -X utf8 tooling/tests/qualification_ops/run_offline.py --output-directory test-results --partition ${{ matrix.partition }}
      - name: Retain sanitized results only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            test-results/collection.json
            test-results/combined.json
            test-results/combined.xml
            test-results/diagnostics/*-receipt.json
            test-results/diagnostics/*-outcomes.json
            test-results/diagnostics/*-events.jsonl
            test-results/diagnostics/*-child.log
          if-no-files-found: error
          retention-days: 14

  windows-complete:
    name: offline-operations (windows-latest)
    runs-on: ubuntu-latest
    needs: [changes, offline-operations]
    # Not when the run itself was cancelled (a newer push superseded it): that is not a failure.
    if: ${{ !cancelled() }}
    steps:
      - name: Require every offline partition to pass (or the suite to be out of scope)
        env:
          PARTITIONS_RESULT: ${{ needs.offline-operations.result }}
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$RUN" = true ]; then test "$PARTITIONS_RESULT" = success; else test "$PARTITIONS_RESULT" = skipped; fi
