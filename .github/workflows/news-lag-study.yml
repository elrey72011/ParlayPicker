name: News lag study (one-time research)
# Owner 2026-11-08: one-time budget of 5,000 Odds API credits. Do the stake books lag Pinnacle
# after NBA injury news? Needs the archived reports ("NBA injury reports" workflow) for the days.
# A label runs once (write-once start marker on Drive), so the budget cannot be spent twice.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "first ET day of injury reports (YYYY-MM-DD)"
        required: true
        default: "2026-10-21"
      end:
        description: "last ET day (YYYY-MM-DD)"
        required: true
      max_credits:
        description: "credit cap (at most the owner's 5000)"
        required: false
        default: "5000"
      label:
        description: "run label; a label runs once"
        required: false
        default: "v1"
permissions:
  contents: read
concurrency:
  group: news-lag-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the study
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MAX_CREDITS: ${{ inputs.max_credits }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          python -u scripts/news_lag_study.py --start "$START" --end "$END" --max-credits "${MAX_CREDITS:-5000}" \
            --label "${LABEL:-v1}" --output "$RUNNER_TEMP/news-lag-study/study.json"
      - name: Keep the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: news-lag-study
          path: ${{ runner.temp }}/news-lag-study/
          if-no-files-found: ignore
