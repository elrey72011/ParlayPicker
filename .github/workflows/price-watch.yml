name: Price watch (research)
# Roadmap M2 (owner D28, 2026-11-09): every 15 minutes (NBA) or 30 (NCAAB), capture prices for
# the stored games starting within 3 hours (US books, Pinnacle, Novig where switched on; spreads
# and totals). 4 Odds API credits per request, from its own allowance (200 a day, 1,400 in all).
# The owner approved both sports for 7 days: the code stops by itself after the night of
# 2026-11-16 (app_core/price_watch.py UNTIL). Set the PARLAYPICKER_PRICE_WATCH repository
# variable to OFF to stop sooner, or to one sport. No stake or wager authority.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep watching (max 340)"
        required: false
        default: "340"
      fast:
        description: "Fast mode for this run: poll both sports every 5 minutes (about 3x the credits; needs the owner's spend approval)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 21 * * *'     # 4:17 PM EST, through the evening slate
    - cron: '30 16 * * 6,0'   # 11:30 AM EST on Saturday and Sunday, for afternoon games
permissions:
  contents: read
concurrency:
  group: price-watch
  cancel-in-progress: false
jobs:
  price-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PARLAYPICKER_PRICE_WATCH: ${{ vars.PARLAYPICKER_PRICE_WATCH || 'NBA,NCAAB' }}
      # NHL (owner 2026-11-09): on unless the PARLAYPICKER_PRICE_WATCH_EXTRA_SPORTS variable says otherwise (OFF stops it).
      # It adds about 100 credits a day (300 in fast mode) to the allowance.
      PARLAYPICKER_PRICE_WATCH_EXTRA_SPORTS: ${{ vars.PARLAYPICKER_PRICE_WATCH_EXTRA_SPORTS || 'NHL' }}
      # Fast mode is off unless this run was started with the fast input, or the repository variable
      # PARLAYPICKER_PRICE_WATCH_FAST is true (every run, scheduled ones included).
      PARLAYPICKER_PRICE_WATCH_FAST: ${{ inputs.fast && 'true' || vars.PARLAYPICKER_PRICE_WATCH_FAST }}
      # Automatic pace (off unless the variable is true): a sport is polled more slowly where the replay
      # shows a slower poll kept 85% of the bets. It never polls faster, so it never adds credits.
      PARLAYPICKER_PRICE_WATCH_AUTO_PACE: ${{ vars.PARLAYPICKER_PRICE_WATCH_AUTO_PACE }}
      # Drive backup workers (2026-11-10): with the default 4, backing up one capture took up to 10
      # minutes and the loop cannot poll meanwhile. 16 brings that to about 2 to 3 minutes.
      PARLAYPICKER_DRIVE_WORKERS: ${{ vars.PARLAYPICKER_DRIVE_WORKERS || '16' }}
      PARLAYPICKER_NOVIG_SPORTS: ${{ vars.PARLAYPICKER_NOVIG_SPORTS }}
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Watch prices for games in their last 3 hours
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
          PARLAYPICKER_DRIVE_CACHE_DIR: ${{ runner.temp }}/drive-cache
        run: python -u scripts/price_watch_loop.py --minutes "$MINUTES" --interval 5
