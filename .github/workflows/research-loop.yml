name: Research capture and grading (loop)
# Owner request 2026-11-06. GitHub starts the 30-minute research scheduler cron only a
# few times a day, so capture, grading, Pinnacle calibration and certified closes ran
# 2-3 times a day. This starts twice a day and runs the same research cycle
# (scripts/run_research_scheduler.py, unchanged) every 30 minutes for up to 340 minutes
# (scripts/research_loop.py). It shares the scheduler's concurrency group, so the two
# never write the evidence store at the same time, and it ends early when a Bound plan or
# Deployment review run is waiting. Public repository: runner minutes are free.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep cycling (max 340)"
        required: false
        default: "340"
  schedule:
    - cron: '47 16 * * *'     # 11:47 AM EST / 12:47 PM EDT, inside the 11:45 AM window (was 11:37, a skipped first cycle)
    - cron: '7 22 * * *'      # 5:07 PM EST / 6:07 PM EDT, through the evening slate
    # 11:13 PM EST / 12:13 AM EDT: grades the late games. A final is graded only 3 hours
    # after tip-off, so the evening run (ends ~10:50 PM) graded no NBA game on 2026-11-06.
    # Cycles after the 2:30 AM ET operating window close are skipped.
    - cron: '13 4 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: research-capture-and-grading
  cancel-in-progress: false
jobs:
  research-loop:
    if: vars.RESEARCH_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PARLAYPICKER_NETLIFY_SITE_ID: ${{ vars.PARLAYPICKER_NETLIFY_SITE_ID }}
      RESEARCH_SPORTS: ${{ vars.RESEARCH_SPORTS || 'NFL,NCAAF,NBA,NCAAB,MLB,NHL' }}
      PARLAYPICKER_DRIVE_INVENTORY_REUSE_SECONDS: "900"
      PARLAYPICKER_CERTIFIED_CLOSE_SPORTS: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_SPORTS }}
      PARLAYPICKER_CERTIFIED_CLOSE_MARKETS: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_MARKETS }}
      # Whole-game closes (40 credits) may use a quarter of the daily close allowance; the rest is kept for
      # bets' own closes (10 credits) on games still to start (2026-11-10). 1 restores the old behaviour.
      PARLAYPICKER_CERTIFIED_CLOSE_REST_SHARE: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_REST_SHARE || '0.25' }}
      # NCAAB close allowance (owner 2026-11-11, option B): 700 a day and 15,000 per 31 days, so every bet's
      # close can be fetched. The code default stays 400 and 4,500; NBA stays 100 and 2,500.
      PARLAYPICKER_CERTIFIED_CLOSE_LIMITS: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_LIMITS || 'NCAAB=700/15000' }}
      # Also fetch Pinnacle's close with each bet's own (2026-11-12): the benchmark a bet at an exchange
      # can be judged against. Same request, same cost. Set the variable to false to stop.
      PARLAYPICKER_CERTIFIED_CLOSE_PINNACLE: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_PINNACLE || 'true' }}
      PARLAYPICKER_RESEARCH_CAPTURE_HOURS: ${{ vars.PARLAYPICKER_RESEARCH_CAPTURE_HOURS }}
      PARLAYPICKER_PINNACLE_SPORTS: ${{ vars.PARLAYPICKER_PINNACLE_SPORTS }}
      PARLAYPICKER_NOVIG_SPORTS: ${{ vars.PARLAYPICKER_NOVIG_SPORTS }}
      PARLAYPICKER_NHL_SETTLEMENT: ${{ vars.PARLAYPICKER_NHL_SETTLEMENT }}
      # Fewer, fuller provider requests so 30-minute cycles stay inside the per-sport
      # daily credit caps (app_core/odds_research_adapter.py, BATCHING_ENV).
      PARLAYPICKER_RESEARCH_BATCHING: "true"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-research-loop-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Run the research cycle every 30 minutes
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
          PARLAYPICKER_EVIDENCE_DIR: ${{ runner.temp }}/research-evidence
          PARLAYPICKER_DRIVE_CACHE_DIR: ${{ runner.temp }}/drive-cache
        run: python -u scripts/research_loop.py --minutes "$MINUTES" --interval 30 --out "$RUNNER_TEMP/research-loop"
      - name: Save the verified Drive object cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-research-loop-${{ github.run_id }}
      - name: Retain sanitized cycle audits
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-loop-cycle-audits
          path: ${{ runner.temp }}/research-loop/research-cycle-audit-*.json
          if-no-files-found: warn
