name: Bound plan (draft, review, freeze)
# Roadmap C2 / D11. `draft` restores the canonical evidence read-only and publishes each
# research market's status plus a proposed plan bound to the candidate model and its
# calibration, with a plan hash. Nothing changes. `freeze` is the owner's step after
# reviewing a draft: it redrafts from the reviewed inputs, freezes only when the plan
# hash matches, and backs the new row up to Drive with read-back. No Odds API or CFBD calls.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "draft (read-only) or freeze (after review)"
        required: true
        default: draft
        type: choice
        options: [draft, freeze]
      sport:
        description: "Research sport"
        required: false
        default: NCAAB
        type: choice
        options: [NCAAB, NBA]
      market:
        description: "Market family"
        required: false
        default: SPREAD
        type: choice
        options: [SPREAD, TOTAL]
      methodology:
        description: "draft only: market_skill (scored against the market's no-vig price, D19 B) or v1"
        required: false
        default: market_skill
        type: choice
        options: [market_skill, v1]
      validation_start:
        description: "draft only: ISO validation start (blank = next UTC midnight)"
        required: false
        default: ""
      freeze_inputs:
        description: "freeze only: the JSON freeze inputs from the reviewed draft"
        required: false
        default: ""
      expected_hash:
        description: "freeze only: the plan hash from the reviewed draft"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  # Freezing writes the canonical store, so it never overlaps capture and grading.
  group: research-capture-and-grading
  cancel-in-progress: false
jobs:
  bound-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-bound-plan-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Draft or freeze
        env:
          ACTION: ${{ inputs.action }}
          SPORT: ${{ inputs.sport }}
          MARKET: ${{ inputs.market }}
          VALIDATION_START: ${{ inputs.validation_start }}
          METHODOLOGY: ${{ inputs.methodology }}
          FREEZE_INPUTS: ${{ inputs.freeze_inputs }}
          EXPECTED_HASH: ${{ inputs.expected_hash }}
          OUT: ${{ runner.temp }}/bound-plan
        run: |
          set -euo pipefail
          args=("$ACTION" --directory "$OUT/evidence" --output "$OUT/report/bound-plan.json"
                --cache-dir "$RUNNER_TEMP/drive-cache" --sport "$SPORT" --market "$MARKET")
          if [ "$ACTION" = draft ] && [ -n "$VALIDATION_START" ]; then args+=(--validation-start "$VALIDATION_START"); fi
          if [ "$ACTION" = draft ]; then args+=(--methodology "${METHODOLOGY:-market_skill}"); fi
          if [ "$ACTION" = freeze ]; then args+=(--inputs "$FREEZE_INPUTS" --expected-hash "$EXPECTED_HASH"); fi
          python -u scripts/bound_plan.py "${args[@]}"
      - name: Save the verified Drive object cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-bound-plan-${{ github.run_id }}
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bound-plan-${{ inputs.action }}
          path: ${{ runner.temp }}/bound-plan/report/
          if-no-files-found: warn
