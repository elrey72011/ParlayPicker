name: Bound plan (draft, review, freeze)
# Roadmap C2 / D11. `draft` restores the canonical evidence read-only and publishes each
# research market's status plus a proposed plan bound to the candidate model and its
# calibration, with a plan hash. Nothing changes. `freeze` is the owner's step after
# reviewing a draft: it redrafts from the reviewed inputs, freezes only when the plan
# hash matches, and backs the new row up to Drive with read-back. No Odds API or CFBD calls.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "draft (read-only) or freeze (after review)"
        required: true
        default: draft
        type: choice
        options: [draft, freeze]
      sport:
        description: "Research sport"
        required: false
        default: NCAAB
        type: choice
        options: [NCAAB, NBA, NHL]
      market:
        description: "Market family"
        required: false
        default: SPREAD
        type: choice
        options: [SPREAD, TOTAL, PUCK_LINE]
      model:
        description: "draft only: research (the pinned score model) or pinnacle (Pinnacle's no-vig price)"
        required: false
        default: research
        type: choice
        options: [research, pinnacle]
      methodology:
        description: "draft only: market_skill (scored against the market's no-vig price, D19 B), market_skill_v2 (CLV-led gates, D26) or v1"
        required: false
        default: market_skill
        type: choice
        options: [market_skill, market_skill_v2, v1]
      min_bets:
        description: "draft only, market_skill_v2: bets needed in each window (locks at the freeze)"
        required: false
        default: "75"
        type: choice
        options: ["50", "60", "75", "100"]
      pool:
        description: "draft only, market_skill_v2 with the pinnacle model: count bets across sports (D27)"
        required: false
        default: false
        type: boolean
      pool_sports:
        description: "draft only, with pool: the sports pooled (every one must freeze the same plan)"
        required: false
        default: "NBA,NCAAB"
        type: choice
        options: ["NBA,NCAAB", "NBA,NCAAB,NHL", "NBA,NHL", "NCAAB,NHL"]
      min_edge:
        description: "draft only, market_skill: minimum EV for a bet (locks at the freeze; see the replay estimate)"
        required: false
        default: "0.02"
        type: choice
        options: ["0.02", "0.01"]
      entry_rule:
        description: "draft only, market_skill: earliest (first shared-line capture) or first_edge (first capture that clears the bet threshold)"
        required: false
        default: earliest
        type: choice
        options: [earliest, first_edge]
      entry_books:
        description: "draft only, pinnacle model: the stake books the plan may enter at (locks at the freeze)"
        required: false
        default: all
        type: choice
        options: [all, Novig]
      validation_start:
        description: "draft only: ISO validation start (blank = next UTC midnight)"
        required: false
        default: ""
      freeze_inputs:
        description: "freeze only: the JSON freeze inputs from the reviewed draft"
        required: false
        default: ""
      expected_hash:
        description: "freeze only: the plan hash from the reviewed draft"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  # Freezing writes the canonical store, so it never overlaps capture and grading.
  group: research-capture-and-grading
  cancel-in-progress: false
jobs:
  bound-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      # Settlement settings, so the draft's market table shows each market's real stage (D17).
      PARLAYPICKER_NHL_SETTLEMENT: ${{ vars.PARLAYPICKER_NHL_SETTLEMENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-bound-plan-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Draft or freeze
        env:
          ACTION: ${{ inputs.action }}
          SPORT: ${{ inputs.sport }}
          MARKET: ${{ inputs.market }}
          VALIDATION_START: ${{ inputs.validation_start }}
          METHODOLOGY: ${{ inputs.methodology }}
          MODEL: ${{ inputs.model }}
          MIN_EDGE: ${{ inputs.min_edge }}
          ENTRY_RULE: ${{ inputs.entry_rule }}
          MIN_BETS: ${{ inputs.min_bets }}
          POOL: ${{ inputs.pool }}
          POOL_SPORTS: ${{ inputs.pool_sports }}
          ENTRY_BOOKS: ${{ inputs.entry_books }}
          FREEZE_INPUTS: ${{ inputs.freeze_inputs }}
          EXPECTED_HASH: ${{ inputs.expected_hash }}
          OUT: ${{ runner.temp }}/bound-plan
        run: |
          set -euo pipefail
          args=("$ACTION" --directory "$OUT/evidence" --output "$OUT/report/bound-plan.json"
                --cache-dir "$RUNNER_TEMP/drive-cache" --sport "$SPORT" --market "$MARKET")
          if [ "$ACTION" = draft ] && [ -n "$VALIDATION_START" ]; then args+=(--validation-start "$VALIDATION_START"); fi
          if [ "$ACTION" = draft ]; then args+=(--methodology "${METHODOLOGY:-market_skill}" --model "${MODEL:-research}" --min-edge "${MIN_EDGE:-0.02}" --entry-rule "${ENTRY_RULE:-earliest}" --min-bets "${MIN_BETS:-75}"); fi
          if [ "$ACTION" = draft ] && [ "$POOL" = true ]; then args+=(--pool --pool-sports "${POOL_SPORTS:-NBA,NCAAB}"); fi
          if [ "$ACTION" = draft ] && [ -n "${ENTRY_BOOKS:-}" ] && [ "$ENTRY_BOOKS" != all ]; then args+=(--entry-books "$ENTRY_BOOKS"); fi
          if [ "$ACTION" = freeze ]; then args+=(--inputs "$FREEZE_INPUTS" --expected-hash "$EXPECTED_HASH"); fi
          python -u scripts/bound_plan.py "${args[@]}"
      - name: Save the verified Drive object cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-bound-plan-${{ github.run_id }}
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bound-plan-${{ inputs.action }}
          path: ${{ runner.temp }}/bound-plan/report/
          if-no-files-found: warn
