name: Read-only six-sport evidence census

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Optional prior census run ID whose checkpoint artifact should be resumed"
        required: false
        default: ""
        type: string
      max_objects:
        description: "Maximum new immutable objects verified in this slice"
        required: true
        default: "5000"
        type: string
      full_verify:
        description: "Redownload even objects represented by an accepted checkpoint"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: read-only-six-sport-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      CENSUS_DIR: ${{ runner.temp }}/read-only-census
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Resume a verified prior checkpoint
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: read-only-census-state
          path: ${{ runner.temp }}/read-only-census
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Create census state directory
        run: mkdir -p "$CENSUS_DIR"
      - name: Run one bounded read-only slice
        env:
          CENSUS_MAX_OBJECTS: ${{ inputs.max_objects }}
          CENSUS_FULL_VERIFY_FLAG: ${{ inputs.full_verify && '--full-verify' || '' }}
        run: >-
          python -u scripts/run_read_only_census.py
          --checkpoint "$CENSUS_DIR/checkpoint.json"
          --output "$CENSUS_DIR/report.json"
          --source-revision "$GITHUB_SHA"
          --max-objects "$CENSUS_MAX_OBJECTS"
          --max-bytes 500000000
          --deadline-seconds 2700
          $CENSUS_FULL_VERIFY_FLAG
      - name: Retain checkpoint and sanitized terminal report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: read-only-census-state
          path: |
            ${{ runner.temp }}/read-only-census/checkpoint.json
            ${{ runner.temp }}/read-only-census/report.json
          if-no-files-found: warn
          retention-days: 14
