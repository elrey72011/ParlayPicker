name: Subscriber completion PostgreSQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: subscriber-completion-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  completion-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: subscriber_test
          POSTGRES_USER: subscriber
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U subscriber -d subscriber_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PAID_TEST_DATABASE_URL: postgresql://subscriber:test-only@localhost:5432/subscriber_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/subscriber/requirements.txt
      - name: Install isolated subscriber dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r services/subscriber/requirements.txt
      - name: Run the three subscriber completion cases
        run: >-
          python -m pytest -q
          tests/paid_launch/case_subscriber_completion.py::test_offer_and_account_preferences_are_server_owned
          tests/paid_launch/case_subscriber_completion.py::test_results_are_complete_and_scoped_to_entitled_product
          tests/paid_launch/case_subscriber_completion.py::test_cancellation_remains_available_when_sales_are_disabled
          --junitxml=subscriber-completion-tests.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: subscriber-completion-test-results
          path: subscriber-completion-tests.xml
          retention-days: 14
