name: NCAAF line backtest (research only)
# Roadmap D18 step 1: rebuild the frozen NCAAF research model from CFBD 2023-2025 and
# measure it against archived 2025 betting lines. About 60 CFBD calls; no Odds API
# calls; writes nothing to Drive or the evidence store.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild and backtest
        run: python -u scripts/ncaaf_line_backtest.py --output "${{ runner.temp }}/ncaaf-backtest/ncaaf-line-backtest.json"
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-line-backtest
          path: ${{ runner.temp }}/ncaaf-backtest/
          if-no-files-found: warn
