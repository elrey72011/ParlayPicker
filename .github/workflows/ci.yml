name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# New commits supersede checks on the same PR. Each main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile production modules
        run: python -m compileall -q app app_core core scripts/train_xgboost_model.py streamlit_app.py
      - name: Run production-safety regressions
        run: >
          python -m pytest -q --durations=30 --junitxml=test-results/production-safety.xml
          tests/test_best_picks_kelly_attach.py
          tests/test_portfolio_calibration_and_caps.py
          tests/test_novig_fetch_no_hardcoded_date.py
          tests/test_wnba_selection.py
          tests/test_wnba_kalshi_matching.py
          tests/test_ncaaf_selection.py
          tests/test_consistent_spread_book.py
          tests/test_preselection_line_audit_consistency.py
          tests/test_consistent_total_book.py
          tests/test_recovered_row_value.py
          tests/test_totals_pick_direction.py
          tests/test_kalshi_wrong_game_title_guard.py
          tests/test_force_deploy_staking.py
          tests/test_bucket_calibration.py
          tests/test_empirical_tiers.py
          tests/test_production_card_calibration_guard.py
          tests/test_model_validation.py
          tests/test_selector_validation.py
          tests/test_run_readiness.py
          tests/test_prediction_evidence.py
          tests/test_threshold_validation.py
          tests/test_evidence_health.py
          tests/test_evidence_remote.py
          tests/test_evidence_drive.py
          tests/test_evidence_config.py
          tests/test_ncaaf_stats_aliases.py
          tests/test_compact_probability_export.py
          tests/test_walk_forward.py
          tests/test_ml_target_guard.py
          tests/test_parlay_safety.py
          tests/test_candidate_recap.py
          tests/test_best_available_candidate_audit.py
          tests/test_lean_card.py
          tests/test_regression_kalshi_and_results.py::test_results_recap_upload_reset_behavior

      - name: Upload production-safety test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-safety-test-results
          path: test-results/production-safety.xml
          retention-days: 7
          if-no-files-found: warn

  full-suite-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run application test shard
        run: python scripts/run_ci_tests.py --shard ${{ matrix.shard }} --shards 2 -q tests --durations=30 --junitxml=test-results/full-suite-${{ matrix.shard }}.xml
      - name: Upload full-suite test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-test-results-${{ matrix.shard }}
          path: test-results/full-suite-${{ matrix.shard }}.xml
          retention-days: 7
          if-no-files-found: warn


  # Preserve the existing required check name; every shard must pass.
  full-suite:
    needs: full-suite-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every application test shard to pass
        env:
          SHARD_RESULT: ${{ needs.full-suite-tests.result }}
        run: test "$SHARD_RESULT" = success
