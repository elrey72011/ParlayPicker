name: Research picks (NBA, NCAAB, NHL)
# Board of picks from the in-season research score models (app_core/research_picks.py) at the
# best available price, plus a replayed record of the same rule on finished games. Restores
# the canonical store read-only (every Drive upload refused); no Odds API or CFBD calls.
# Research only: no market is qualified, so every pick is NO_BET with zero stake.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 22 * * *'      # 5:47 PM EST, before the evening slate
    - cron: '47 15 * * 0,6'    # weekends 10:47 AM EST
permissions:
  contents: read
concurrency:
  group: research-picks
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the verified Drive object cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-research-picks-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Build the research picks board
        run: >-
          python -u scripts/research_picks.py
          --directory "${{ runner.temp }}/research-picks/evidence"
          --output "${{ runner.temp }}/research-picks/report/research-picks.json"
          --cache-dir "${{ runner.temp }}/drive-cache"
      - name: Save the verified Drive object cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-research-picks-${{ github.run_id }}
      - name: Keep the board
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-picks
          path: ${{ runner.temp }}/research-picks/report/
          if-no-files-found: warn
