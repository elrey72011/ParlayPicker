name: Research capture and grading
on:
  workflow_dispatch:
    inputs:
      sports:
        description: 'Optional comma-separated override: MLB,NCAAF,NFL'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '15,45 0-7,15-23 * * *'
permissions:
  contents: read
concurrency:
  group: research-capture-and-grading
  cancel-in-progress: false
jobs:
  research:
    if: vars.RESEARCH_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PARLAYPICKER_NETLIFY_SITE_ID: ${{ vars.PARLAYPICKER_NETLIFY_SITE_ID }}
      RESEARCH_SPORTS: ${{ inputs.sports || vars.RESEARCH_SPORTS || 'MLB,NCAAF' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Check Eastern operating window
        id: window
        run: echo "active=$(python scripts/research_schedule_window.py)" >> "$GITHUB_OUTPUT"
      - name: Install runtime dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Restore, capture, grade and verify backup
        if: steps.window.outputs.active == 'true'
        env:
          PARLAYPICKER_EVIDENCE_DIR: ${{ runner.temp }}/research-evidence
        run: python scripts/run_research_scheduler.py

      - name: Restore immutable activation evidence
        id: activation_restore
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        run: python scripts/prediction_evidence.py restore --database data/prediction_evidence/evidence.sqlite3
      - name: Collect strict closes, append outcomes and back up evidence
        if: ${{ !cancelled() && steps.activation_restore.outcome == 'success' && steps.window.outputs.active == 'true' }}
        run: python scripts/bootstrap_evidence.py --capture-closes --grade --backup
      - name: Report evidence health
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        run: python scripts/prediction_evidence.py status --database data/prediction_evidence/evidence.sqlite3
