name: Research capture and grading
on:
  workflow_dispatch:
    inputs:
      sports:
        description: 'Optional sport override, or FOOTBALL_STAGE1 for an authenticated Stage 1 capture'
        required: false
        default: ''
        type: string
      football_v3_audit:
        description: 'Read-only authenticated football V3 feasibility audit'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15,45 0-7,15-23 * * *'
permissions:
  contents: read
  actions: read
jobs:
  loop-check:
    # Outside the concurrency group: a scheduled run that would queue behind a research loop
    # and cancel it (GitHub keeps one pending run per group) does nothing instead (audit 2026-11-09).
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active: ${{ steps.loop.outputs.active }}
    steps:
      - uses: actions/checkout@v5
      - id: loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/research_loop_active.py
  configuration-preflight:
    if: (github.event_name == 'workflow_dispatch' || vars.RESEARCH_SCHEDULER_ENABLED == 'true') && inputs.football_v3_audit != true && inputs.sports != 'FOOTBALL_STAGE1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PREFLIGHT_RESEARCH_ENABLED: ${{ vars.RESEARCH_SCHEDULER_ENABLED == 'true' }}
      PREFLIGHT_DRIVE_FOLDER_PRESENT: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID != '' }}
      PREFLIGHT_SERVICE_ACCOUNT_PRESENT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT != '' }}
      PREFLIGHT_ODDS_KEY_PRESENT: ${{ secrets.ODDS_API_KEY != '' }}
      PREFLIGHT_CFBD_KEY_PRESENT: ${{ secrets.CFBD_API_KEY != '' }}
      PREFLIGHT_NETLIFY_SITE_PRESENT: ${{ vars.PARLAYPICKER_NETLIFY_SITE_ID != '' }}
      RESEARCH_SPORTS: ${{ inputs.sports || vars.RESEARCH_SPORTS || 'NFL,NCAAF,NBA,NCAAB,MLB,NHL' }}
    steps:
      - uses: actions/checkout@v5
      - name: Report configuration presence only
        run: python scripts/research_actions_preflight.py
  research:
    if: vars.RESEARCH_SCHEDULER_ENABLED == 'true' && inputs.football_v3_audit != true && inputs.sports != 'FOOTBALL_STAGE1' && needs.loop-check.outputs.active != 'true'
    needs: [configuration-preflight, loop-check]
    runs-on: ubuntu-latest
    concurrency:
      group: research-capture-and-grading
      cancel-in-progress: false
    # G7: every evidence record is its own Drive object, uploaded at about 2.4/s, so a
    # large slate (e.g. ~150 NCAAB games, ~5,500 records) needs ~40 minutes of upload
    # alone. A run killed mid-upload loses its unsaved records. Public repository:
    # standard runner minutes are free; the concurrency group prevents overlap.
    timeout-minutes: 150
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PARLAYPICKER_NETLIFY_SITE_ID: ${{ vars.PARLAYPICKER_NETLIFY_SITE_ID }}
      RESEARCH_SPORTS: ${{ inputs.sports || vars.RESEARCH_SPORTS || 'NFL,NCAAF,NBA,NCAAB,MLB,NHL' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Check Eastern operating window
        id: window
        run: echo "active=$(python scripts/research_schedule_window.py)" >> "$GITHUB_OUTPUT"
      - name: Install runtime dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      # Every evidence record is its own Drive object (~80k). Keep a checksum-verified
      # copy between runs so each cycle downloads only new or changed objects
      # (app_core/evidence_drive.py, PARLAYPICKER_DRIVE_CACHE_DIR).
      - name: Restore the verified Drive object cache
        if: steps.window.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-research-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Restore, capture, grade and verify backup
        if: steps.window.outputs.active == 'true'
        env:
          PARLAYPICKER_EVIDENCE_DIR: ${{ runner.temp }}/research-evidence
          RESEARCH_AUDIT_PATH: ${{ runner.temp }}/research-cycle-audit.json
          PARLAYPICKER_DRIVE_CACHE_DIR: ${{ runner.temp }}/drive-cache
          # Reuse one complete Drive listing for evidence restores for up to 15 minutes
          # (evidence_drive.DRIVE_INVENTORY_REUSE_ENV); lock reads always list fresh.
          PARLAYPICKER_DRIVE_INVENTORY_REUSE_SECONDS: "900"
          # Certified closes (roadmap C1, owner decision D13): off unless the repository
          # variable names sports. Option B: NBA, spread market only.
          PARLAYPICKER_CERTIFIED_CLOSE_SPORTS: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_SPORTS }}
          PARLAYPICKER_CERTIFIED_CLOSE_MARKETS: ${{ vars.PARLAYPICKER_CERTIFIED_CLOSE_MARKETS }}
          # D16: hours ahead to capture NBA/NCAAB/NHL prices (default 2, range 2-24).
          PARLAYPICKER_RESEARCH_CAPTURE_HOURS: ${{ vars.PARLAYPICKER_RESEARCH_CAPTURE_HOURS }}
          # D4 option A: Pinnacle as the fair-price reference ("NBA,NCAAB"); unset = off.
          PARLAYPICKER_PINNACLE_SPORTS: ${{ vars.PARLAYPICKER_PINNACLE_SPORTS }}
          PARLAYPICKER_NOVIG_SPORTS: ${{ vars.PARLAYPICKER_NOVIG_SPORTS }}
          # D17: NHL settles only per game against the NHL official final ("official_check").
          PARLAYPICKER_NHL_SETTLEMENT: ${{ vars.PARLAYPICKER_NHL_SETTLEMENT }}
          # The same fewer, fuller provider requests as the research loop, whose 30-minute
          # cycles this run replaces when no loop is active (audit 2026-11-09).
          PARLAYPICKER_RESEARCH_BATCHING: "true"
        run: python -u scripts/run_research_scheduler.py
      - name: Save the verified Drive object cache
        if: ${{ always() && steps.window.outputs.active == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/drive-cache
          key: drive-cache-research-${{ github.run_id }}
      - name: Retain sanitized cycle audit
        if: ${{ always() && steps.window.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: six-sport-research-cycle-audit
          path: ${{ runner.temp }}/research-cycle-audit.json
          if-no-files-found: warn


  # activation-evidence (closing-line capture) moved to closing-capture.yml (roadmap E1.4)
  football-v3-feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.football_v3_audit == true
    concurrency:
      group: research-capture-and-grading
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: 0AAx101w9xyZcUk9PVA
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install read-only audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore and audit football evidence without remote writes
        run: >-
          python -u scripts/football_v3_feasibility_audit.py
          --root "${{ runner.temp }}/football-v3-evidence"
          --output "${{ runner.temp }}/football-v3-feasibility.json"
      - name: Retain sanitized football feasibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-v3-feasibility-audit
          path: ${{ runner.temp }}/football-v3-feasibility.json
          if-no-files-found: warn
  football-stage1-branch-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.sports == 'FOOTBALL_STAGE1' && inputs.football_v3_audit != true
    concurrency:
      group: research-capture-and-grading
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore, capture, settle and verify Stage 1 evidence
        run: >-
          python -u scripts/run_football_stage1.py
          --database "${{ runner.temp }}/football-stage1/evidence.sqlite3"
          --output-dir "${{ runner.temp }}/football-stage1/artifacts"
      - name: Retain sanitized Stage 1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-stage1-branch-cycle-audit
          path: ${{ runner.temp }}/football-stage1/artifacts/*.json
          if-no-files-found: warn
