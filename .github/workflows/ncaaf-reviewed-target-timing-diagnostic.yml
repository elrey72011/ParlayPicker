name: Bounded chronology capacity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-chronology-capacity-diagnostic-v1
  cancel-in-progress: false
jobs:
  critical-shard-5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 67682237f1e3dc48435393259127b0aed3b9fa93
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
          cache: pip
      - name: Verify exact diagnostic checkout and immutable inputs
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          head=git('rev-parse','HEAD')
          tree=git('rev-parse','HEAD^{tree}')
          parents=[r.split()[1] for r in git('cat-file','-p','HEAD').splitlines() if r.startswith('parent ')]
          assert head=='67682237f1e3dc48435393259127b0aed3b9fa93'
          assert tree=='8df27b4cfd2cc7e0a8ea52de6b2f62ba95d7f66b'
          assert parents==['ddba4aa72397a396cb274e4cc95e101222b58e18','830bbddbb9bb30c643857b86e0939d675712d141']
          assert hashlib.sha256(Path('scripts/ci_test_file_costs_v1.json').read_bytes()).hexdigest()=='287444d8aae28cd41d30a8f8e62b48ccebafbe989481ee030970bbdc0336d2bd'
          assert hashlib.sha256(Path('requirements.txt').read_bytes()).hexdigest()=='8d40c306dd66255c64311c2e6ddac51023a4e61906d9cc86f0d449a3bded8a09'
          Path('test-results').mkdir(exist_ok=True)
          Path('test-results/diagnostic-checkout.json').write_text(json.dumps(dict(head=head,tree=tree,ordered_parents=parents,python=platform.python_version(),platform=platform.platform(),diagnostic_only=True),indent=2))
          PY
      - name: Install retained release dependency versions
        run: |
          python -m pip install --upgrade pip
          cat > "$RUNNER_TEMP/chronology-constraints.txt" <<'CONSTRAINTS'
          altair==6.3.0
          annotated-types==0.8.0
          anyio==4.15.1
          appdirs==1.4.4
          attrs==26.1.0
          bcrypt==5.0.0
          blinker==1.9.0
          cachetools==7.2.3
          certifi==2026.10.18
          cffi==2.1.1
          charset_normalizer==3.5.2
          click==8.5.0
          cloudpickle==3.1.2
          cramjam==2.14.0
          cryptography==50.0.2
          distro==1.9.0
          et-xmlfile==2.0.0
          fastparquet==2026.9.0
          fsspec==2026.9.0
          gitdb==4.0.12
          gitpython==3.2.1
          google-auth==2.62.0
          google-genai==2.31.0
          h11==0.16.0
          httpcore==1.0.9
          httptools==0.9.0
          httpx==0.28.1
          idna==3.20
          iniconfig==2.3.1
          invoke==3.0.3
          itsdangerous==2.2.0
          jinja2==3.1.6
          joblib==1.6.0
          jsonschema==4.26.0
          jsonschema-specifications==2025.9.1
          MarkupSafe==3.0.4
          narwhals==2.27.1
          nba_api==1.11.4
          nfl_data_py==0.3.2
          numpy==2.2.6
          nvidia-nccl-cu12==2.32.3
          openpyxl==3.1.5
          packaging==26.3
          pandas==2.2.3
          paramiko==4.0.0
          pillow==12.3.0
          plotly==7.1.0
          pluggy==1.7.0
          protobuf==7.36.2
          pyarrow==19.0.1
          pyasn1==0.6.4
          pyasn1-modules==0.4.2
          pycparser==3.11
          pydantic==2.14.1
          pydantic-core==2.50.1
          pydeck==0.9.3
          pygments==2.21.0
          pynacl==1.6.2
          pypdf==6.20.0
          pytest==9.1.1
          python-dateutil==2.9.0.post0
          python-multipart==0.0.32
          pytz==2026.5
          PyYAML==6.0.3
          rapidfuzz==3.14.6
          referencing==0.37.0
          requests==2.34.2
          rpds-py==2026.9.1
          scikit-learn==1.6.1
          scipy==1.18.1
          six==1.17.0
          smmap==5.0.3
          sniffio==1.3.1
          starlette==1.9.0
          streamlit==1.59.1
          tenacity==9.1.4
          threadpoolctl==3.7.0
          toml==0.10.2
          typing-extensions==4.16.0
          typing-inspection==0.4.4
          tzdata==2026.5
          urllib3==2.8.0
          uvicorn==0.54.0
          vaderSentiment==3.3.2
          watchdog==6.0.0
          websockets==16.1.1
          xgboost==2.1.4
          CONSTRAINTS
          python -m pip install -r requirements.txt pytest -c "$RUNNER_TEMP/chronology-constraints.txt"
          python -m pip list --format=json > test-results/diagnostic-installed-packages.json
      - name: Prepare external timing observer and exact ID preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"chronology-observer"
          root.mkdir()
          (root/'bounded_timing_collector_v1.py').write_bytes(base64.b64decode(''))
          assert hashlib.sha256((root/'bounded_timing_collector_v1.py').read_bytes()).hexdigest()=='2746fefd5eb7092a6d86ab4c86acec7fa122260f9a97655d1b45986d50d01de6'
          (root/'bounded_timing_launcher_v1.py').write_bytes(base64.b64decode(''))
          assert hashlib.sha256((root/'bounded_timing_launcher_v1.py').read_bytes()).hexdigest()=='9d4280344e98e582eeda336696a6d34960a1fc21eba71d643be65fd786bb71d7'
          (root/'expected-ids.json').write_bytes(base64.b64decode(''))
          assert hashlib.sha256((root/'expected-ids.json').read_bytes()).hexdigest()=='c4aba34d460f69356268328943b67efcdd86a49d9c3ec331546edb8f234b0f3b'
          Path("test-results/diagnostic-observer-hashes.json").write_text(json.dumps({'bounded_timing_collector_v1.py': '2746fefd5eb7092a6d86ab4c86acec7fa122260f9a97655d1b45986d50d01de6', 'bounded_timing_launcher_v1.py': '9d4280344e98e582eeda336696a6d34960a1fc21eba71d643be65fd786bb71d7', 'expected-ids.json': 'c4aba34d460f69356268328943b67efcdd86a49d9c3ec331546edb8f234b0f3b'},indent=2))
          PY
      - name: Run unchanged critical shard with release ordering and default temp behavior
        timeout-minutes: 27
        env:
          PYTHONPATH: ${{ runner.temp }}/chronology-observer
        run: >-
          python "$RUNNER_TEMP/chronology-observer/bounded_timing_launcher_v1.py" scripts/run_ci_tests.py --shard 5 --shards 9 --timing-profile scripts/ci_test_file_costs_v1.json --assignment-manifest test-results/full-suite-5-assignment.json -v tests --durations=30 --junitxml=test-results/full-suite-5.xml
      - name: Preserve complete or partial diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: chronology-capacity-shard5-830bbdd-v1
          path: test-results/
          retention-days: 14
          if-no-files-found: error
