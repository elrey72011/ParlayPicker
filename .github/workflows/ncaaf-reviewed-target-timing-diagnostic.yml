name: NCAAF reviewed-target timing diagnostic (one bounded job)
on:
  push:
    branches: [codex/ncaaf-reviewed-target-timing-diagnostic-v1]
permissions:
  contents: read
jobs:
  measured-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: tooling
          persist-credentials: false
      - name: Preserve validated diagnostic materials outside the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/reviewed-target-timing/output"
          cp tooling/diagnostics/reviewed-target-timing/* "$RUNNER_TEMP/reviewed-target-timing/"
      - uses: actions/checkout@v5
        with:
          ref: 037f2819ce913b3792ee1a49895a188f13b1a3a7
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the failed release job's observed dependency versions
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt pytest==9.1.1 -c "$RUNNER_TEMP/reviewed-target-timing/diagnostic-constraints.txt"
          python "$RUNNER_TEMP/reviewed-target-timing/record_context.py" --output "$RUNNER_TEMP/reviewed-target-timing/output"
      - name: Validate non-mutating instrumentation
        run: python "$RUNNER_TEMP/reviewed-target-timing/diagnostic_helper.py" --self-test
      - name: Measure exact release prefix with default pytest temporary paths
        timeout-minutes: 26
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 1500s python -u "$RUNNER_TEMP/reviewed-target-timing/diagnostic_helper.py" --root . --preview "$RUNNER_TEMP/reviewed-target-timing/preview.json" --selection "$RUNNER_TEMP/reviewed-target-timing/selection.json" --out "$RUNNER_TEMP/reviewed-target-timing/output" --require-merge
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/reviewed-target-timing/output/step-exit-code.txt"
          exit "$result"
      - name: Retain complete or partial evidence without retry
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-reviewed-target-timing-diagnostic
          path: ${{ runner.temp }}/reviewed-target-timing/output
          if-no-files-found: error
          retention-days: 14
