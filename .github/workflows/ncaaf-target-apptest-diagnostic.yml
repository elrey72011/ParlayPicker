name: NCAAF target AppTest diagnostic (one bounded job)
on:
  push:
    branches: [codex/ncaaf-target-apptest-diagnostic-v1]
permissions:
  contents: read
jobs:
  exact-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: tooling
          persist-credentials: false
      - name: Preserve validated diagnostic outside the application checkout
        run: |
          mkdir -p "$RUNNER_TEMP/apptest-diagnostic/output"
          cp tooling/diagnostics/target-apptest/* "$RUNNER_TEMP/apptest-diagnostic/"
      - uses: actions/checkout@v5
        with:
          ref: 4df0975694226f23e0951ad5f24bf6b89bcb990d
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install observed failed-release dependency versions
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt pytest==9.1.1 -c "$RUNNER_TEMP/apptest-diagnostic/diagnostic-constraints.txt"
      - name: Record public matched context
        run: |
          export GITHUB_EVENT_NAME=pull_request GITHUB_BASE_REF=main GITHUB_HEAD_REF=codex/ncaaf-reviewed-target-v1
          export GITHUB_REF=refs/pull/2434/merge GITHUB_SHA=4df0975694226f23e0951ad5f24bf6b89bcb990d
          python "$RUNNER_TEMP/apptest-diagnostic/record_context.py" --out "$RUNNER_TEMP/apptest-diagnostic/output"
      - name: Exact105 prefix with unchanged AppTest timeout and default temporary paths
        timeout-minutes: 26
        run: |
          export GITHUB_EVENT_NAME=pull_request GITHUB_BASE_REF=main GITHUB_HEAD_REF=codex/ncaaf-reviewed-target-v1
          export GITHUB_REF=refs/pull/2434/merge GITHUB_SHA=4df0975694226f23e0951ad5f24bf6b89bcb990d
          set +e
          timeout --signal=INT --kill-after=30s 1500s python -u "$RUNNER_TEMP/apptest-diagnostic/diagnostic_helper.py" --root . --preview "$RUNNER_TEMP/apptest-diagnostic/preview.json" --selection "$RUNNER_TEMP/apptest-diagnostic/selection.json" --out "$RUNNER_TEMP/apptest-diagnostic/output" > "$RUNNER_TEMP/apptest-diagnostic/output/console.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/apptest-diagnostic/output/step-exit-code.txt"
          exit "$result"
      - name: Retain sanitized complete or partial diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-target-apptest-diagnostic
          path: ${{ runner.temp }}/apptest-diagnostic/output
          if-no-files-found: error
          retention-days: 14
