name: MLB receipt reconciliation
on:
  workflow_dispatch:
    inputs:
      readiness_audit:
        description: 'Run the read-only MLB production-readiness audit'
        type: boolean
        default: false
  schedule:
    - cron: '30 12,18 * * *'
permissions:
  contents: read
concurrency:
  group: mlb-receipt-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.RESEARCH_SCHEDULER_ENABLED == 'true' && inputs.readiness_audit != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-python@v6
        id: setup
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt
      - name: Classify setup or dependency failure
        id: classify_prerequisite
        if: ${{ failure() && (steps.checkout.outcome == 'failure' || steps.setup.outcome == 'failure' || steps.dependencies.outcome == 'failure') }}
        run: |
          if [[ '${{ steps.dependencies.outcome }}' == 'failure' ]]; then
            reason=DEPENDENCY_INSTALL_ERROR
          else
            reason=WORKFLOW_CONFIG_ERROR
          fi
          printf '{"status":"failed","reason_code":"%s","failed_stage":"setup","remote_backup_verified":false}\n' "$reason" > "$RUNNER_TEMP/mlb-receipt-store-audit.json"
          echo "::error title=$reason::$reason"
      - name: Restore, capture live receipts, reconcile, verify backup, and audit
        id: reconcile
        run: |
          export PARLAYPICKER_EVIDENCE_DIR="$RUNNER_TEMP/mlb-receipt-evidence"
          if python -u scripts/capture_mlb_pregame_receipts.py reconcile-remote --max-feeds 100 --output "$RUNNER_TEMP/mlb-receipt-store-audit.json" --capture-live --max-capture-feeds 20; then
            exit 0
          fi
          if [[ ! -s "$RUNNER_TEMP/mlb-receipt-store-audit.json" ]]; then
            printf '{"status":"failed","reason_code":"UNKNOWN_FAILURE","failed_stage":"startup","remote_backup_verified":false}\n' > "$RUNNER_TEMP/mlb-receipt-store-audit.json"
          fi
          exit 1
      - name: Preserve receipt audit or classified failure report
        id: audit_artifact
        if: ${{ !cancelled() && (steps.classify_prerequisite.outcome == 'success' || steps.reconcile.outcome != 'skipped') }}
        uses: actions/upload-artifact@v4
        with:
          name: mlb-receipt-store-audit
          path: ${{ runner.temp }}/mlb-receipt-store-audit.json
          if-no-files-found: error
      - name: Classify artifact failure
        if: ${{ failure() && steps.audit_artifact.outcome == 'failure' }}
        run: echo '::error title=ARTIFACT_FAILURE::ARTIFACT_FAILURE'
  readiness-audit:
    if: inputs.readiness_audit == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore and audit authenticated MLB evidence
        run: |
          python -u scripts/run_mlb_production_readiness.py \
            --database-dir "$RUNNER_TEMP/mlb-readiness/data" \
            --output-dir "$RUNNER_TEMP/mlb-readiness/reports" \
            --source-commit "$GITHUB_SHA"
      - name: Upload sanitized MLB readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-production-readiness-audit
          path: ${{ runner.temp }}/mlb-readiness/reports/*.json
          if-no-files-found: error
