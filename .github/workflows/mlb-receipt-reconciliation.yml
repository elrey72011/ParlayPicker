name: MLB receipt reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: read
concurrency:
  group: mlb-receipt-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.RESEARCH_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      PARLAYPICKER_EVIDENCE_DIR: ${{ runner.temp }}/mlb-receipt-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore, reconcile up to 100 saved games, and verify backup
        run: python -u scripts/capture_mlb_pregame_receipts.py reconcile-remote --max-feeds 100
      - name: Audit chronological training capacity
        run: python -u scripts/capture_mlb_pregame_receipts.py audit --output "$RUNNER_TEMP/mlb-receipt-store-audit.json"
      - name: Preserve receipt audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mlb-receipt-store-audit
          path: ${{ runner.temp }}/mlb-receipt-store-audit.json
          if-no-files-found: warn
