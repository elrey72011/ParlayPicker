name: NCAAB ratings backtest (research only)
# Roadmap C5 (owner 2026-11-17: build a real college basketball model, judged against the market).
# Opponent-adjusted ratings from CollegeBasketballData against archived opening and closing lines:
# the fitted screen, how the ratings' side did where they disagree with the line, and whether the
# closing line then moved toward the ratings. About 46 CBBD calls; no Odds API calls; writes
# nothing to Drive or the evidence store.
on:
  workflow_dispatch:
    inputs:
      scored_season:
        description: 'Season to score (CBBD numbering, 2026 = 2025-26). The season before calibrates, the one before that sets the priors'
        default: '2026'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SCORED_SEASON: ${{ inputs.scored_season }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Ratings backtest
        run: >-
          python -u scripts/ncaab_ratings_backtest.py
          --output "${{ runner.temp }}/ncaab-ratings/ncaab-ratings-backtest.json"
          --scored-season "${SCORED_SEASON:-2026}" --probe
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ncaab-ratings-backtest
          path: ${{ runner.temp }}/ncaab-ratings/
          if-no-files-found: warn
