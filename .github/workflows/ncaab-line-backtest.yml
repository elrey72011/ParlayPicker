name: NCAAB line backtest (research only)
# Roadmap C5: screen a market-anchored NCAAB model on archived CollegeBasketballData
# lines. About 30 CBBD calls (date windows); no Odds API calls; writes nothing to Drive or the evidence store.
on:
  workflow_dispatch:
    inputs:
      train_season:
        description: 'Season to fit on (CBBD numbering, 2024 = 2023-24)'
        default: '2024'
      test_season:
        description: 'Season to calibrate (first half) and score (second half)'
        default: '2025'
      report:
        description: 'backtest (the line screen) or point_value (the measured value of a point of line; about 15 CBBD calls per season and endpoint)'
        default: backtest
        type: choice
        options: [backtest, point_value]
      seasons:
        description: 'point_value only: CBBD seasons, comma-separated (2026 = 2025-26)'
        default: '2025,2026'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      TRAIN_SEASON: ${{ inputs.train_season }}
      TEST_SEASON: ${{ inputs.test_season }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Value of a point
        if: ${{ inputs.report == 'point_value' }}
        env:
          SEASONS: ${{ inputs.seasons }}
        run: >-
          python -u scripts/ncaab_point_value.py
          --output "${{ runner.temp }}/ncaab-backtest/ncaab-point-value.json"
          --seasons "${SEASONS:-2025,2026}"
      - name: Backtest
        if: ${{ inputs.report != 'point_value' }}
        run: >-
          python -u scripts/ncaab_line_backtest.py
          --output "${{ runner.temp }}/ncaab-backtest/ncaab-line-backtest.json"
          --train-season "$TRAIN_SEASON" --test-season "$TEST_SEASON"
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ncaab-line-backtest
          path: ${{ runner.temp }}/ncaab-backtest/
          if-no-files-found: warn
