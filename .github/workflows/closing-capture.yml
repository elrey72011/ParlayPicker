name: Closing-line capture
# Roadmap E1.4. Moved unchanged out of "Research capture and grading", where it
# shared one concurrency group with the hour-long research job, so scheduled
# runs queued behind it and most picks never got a pregame close. Same cadence,
# gating, secrets and command. No odds are fetched unless a saved pick is
# within 30 minutes of kickoff (app_core/activation_closing.capture_live), so
# this adds no new Odds API spend.
on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 0-7,15-23 * * *'
permissions:
  contents: read
concurrency:
  group: closing-line-capture
  cancel-in-progress: false
jobs:
  activation-evidence:
    if: vars.RESEARCH_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARLAYPICKER_DRIVE_FOLDER_ID: ${{ secrets.PARLAYPICKER_DRIVE_FOLDER_ID }}
      PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PARLAYPICKER_GOOGLE_SERVICE_ACCOUNT }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Check Eastern operating window
        id: window
        run: echo "active=$(python scripts/research_schedule_window.py)" >> "$GITHUB_OUTPUT"
      - name: Install runtime dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Restore, collect strict closes and verify backup
        if: steps.window.outputs.active == 'true'
        run: python -u scripts/bootstrap_evidence.py --restore --capture-closes --skip-validation --backup
      - name: Report evidence health
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        run: python -u scripts/prediction_evidence.py status --database data/prediction_evidence/evidence.sqlite3
