# Reference only: connect these subrequests to the selected managed OIDC proxy.
# Staging must prove the group and MFA headers are created by that trusted proxy;
# never accept them directly from an internet client.
location /operator/ {
  auth_request /_operator_oidc_auth;
  auth_request_set $operator_groups $upstream_http_x_auth_request_groups;
  auth_request_set $operator_amr $upstream_http_x_auth_request_amr;
  proxy_set_header X-Verified-Operator-Groups $operator_groups;
  proxy_set_header X-Verified-Operator-AMR $operator_amr;
  proxy_pass http://existing-research-app;
}

location = /_operator_oidc_auth {
  internal;
  proxy_pass http://managed-oidc-proxy/oauth2/auth;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
}
