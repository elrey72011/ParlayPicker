services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: subscriber
      POSTGRES_USER: subscriber
      POSTGRES_PASSWORD: local-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscriber -d subscriber"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: ["subscriber-db:/var/lib/postgresql/data"]
  migrate:
    build: {context: ../.., dockerfile: services/subscriber/Dockerfile}
    env_file: [.env]
    command: ["python", "-m", "services.subscriber.migrate"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: ../.., dockerfile: services/subscriber/Dockerfile}
    env_file: [.env]
    depends_on: {migrate: {condition: service_completed_successfully}}
    read_only: true
    tmpfs: ["/tmp"]
  worker:
    build: {context: ../.., dockerfile: services/subscriber/Dockerfile}
    env_file: [.env]
    command: ["python", "-m", "services.subscriber.worker"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    read_only: true
    tmpfs: ["/tmp"]
  shell:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - ../../web/subscriber:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports: ["127.0.0.1:8025:8025"]
volumes:
  subscriber-db:
