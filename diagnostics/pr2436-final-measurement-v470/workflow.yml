name: PR2436 native shard measurement v470
on:
  push:
    branches: [diag/pr2436-final-measurement-tools-v470]
permissions:
  contents: read
jobs:
  one-bounded-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Record job clock
        run: |
          echo "PP_DIAG_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p diagnostic-evidence
          git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: diagnostic-tools
          persist-credentials: false
      - name: Verify unchanged release pins
        run: |
          test "$(git ls-remote https://github.com/elrey72011/ParlayPicker.git refs/heads/main | cut -f1)" = 8b79b0a0eead4f63a041a551283a4b6be2980d72
          test "$(git ls-remote https://github.com/elrey72011/ParlayPicker.git refs/heads/fix/consolidated-fixture-stability | cut -f1)" = b6af3a7ab41eeb8f6e4387a30b83945704698536
      - uses: actions/checkout@v5
        with:
          ref: 1aa947e932c8e81f1615cc6c93ffaa4cf3b97d36
          path: source
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.15"
      - name: Install unchanged pinned dependencies
        run: |
          python -m pip install "pip==26.2.2"
          python -m pip install -r source/requirements.txt pytest -c diagnostic-tools/diagnostics/pr2436-final-measurement-v470/constraints.txt
      - name: Verify installed offline browser
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Authenticate exact source and required immutable objects
        run: python diagnostic-tools/diagnostics/pr2436-final-measurement-v470/setup_context.py source diagnostic-evidence
      - name: Run exact native shard 9 ordered sequence
        run: >-
          python -I -B diagnostic-tools/diagnostics/pr2436-final-measurement-v470/run.py
          --root source --out diagnostic-evidence/execution --job-start "$PP_DIAG_JOB_START"
      - name: Hash retained complete or partial evidence
        if: ${{ always() }}
        run: python diagnostic-tools/diagnostics/pr2436-final-measurement-v470/hash_artifacts.py diagnostic-evidence
      - name: Retain diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr2436-final-measurement-v470
          path: diagnostic-evidence
          retention-days: 14
          if-no-files-found: error
